<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin · FDM A & B Fixtures</title>
  <link rel="icon" href="/logos/fdm.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script type="module" src="/src/admin/ui/main.ts"></script>
</head>
<body>
<main class="cp-main">
  <header class="cp-header">
    <img src="/logos/fdm.png" alt="" width="52" height="52">
    <div>
      <h1>Site admin</h1>
      <p>Pallacanestro Forte dei Marmi A &amp; B · 2026/27</p>
    </div>
    <a class="cp-sitelink" href="/" target="_blank" rel="noopener">Open the site ↗</a>
  </header>

  <div id="notice" class="cp-message" role="alert" hidden></div>

  <section class="cp-card" aria-labelledby="status-title">
    <h2 id="status-title">Status</h2>
    <div id="status" aria-live="polite" aria-busy="true"><p>Loading…</p></div>
  </section>

  <h2 class="cp-section">Actions</h2>
  <div class="cp-tiles">
    <button type="button" class="cp-tile" data-action="score" disabled><b>Score</b><span>Enter or correct a final score</span></button>
    <button type="button" class="cp-tile" data-action="video" disabled><b>Video</b><span>Add or replace a game recording</span></button>
    <button type="button" class="cp-tile" data-action="stats" disabled><b>Statistics (PDF)</b><span>Publish the statistics and the box score</span></button>
    <button type="button" class="cp-tile" data-action="standings" disabled><b>Standings</b><span>Copy the table of a new bulletin</span></button>
    <button type="button" class="cp-tile" data-action="postpone" disabled><b>Postpone / reschedule</b><span>Call off a game or fix its new date</span></button>
  </div>
</main>
</body>
</html>
