<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Page not found · FDM A & B Fixtures</title>
  <link rel="icon" href="/logos/fdm.png">
  <style>
    :root{--bg:#f2f5fa;--card:#ffffff;--text:#13213a;--muted:#61708a;--line:#dfe6f1;--brand:#173b7b}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1521;--card:#171f2e;--text:#e8edf6;--muted:#97a4ba;--line:#2a3447;--brand:#2878d8;color-scheme:dark}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
    main{max-width:420px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 24px}
    img{width:112px;height:112px}
    h1{font-size:24px;margin:16px 0 6px;text-wrap:balance}
    p{color:var(--muted);margin:0 0 20px}
    a{display:inline-block;padding:12px 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/logos/fdm.png" alt="Pallacanestro Forte dei Marmi logo" width="112" height="112">
    <h1>Page not found</h1>
    <p>This address is not part of the FDM A &amp; B fixtures site.</p>
    <a href="/">Go to the fixtures</a>
  </main>
</body>
</html>
